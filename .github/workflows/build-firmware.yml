name: Build firmware

on:
  workflow_call:
    inputs:
      keyboard:
        type: string
        required: true
      keymap:
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/qmk/qmk_cli:1.2.0

    steps:
    # ここで keyball リポジトリのみ Checkout（qmk_firmware ではない！）
    - name: Checkout this repository
      uses: actions/checkout@v4

    - name: Show QMK version
      run: qmk --version

    # QMK 0.22.14 を qmk_firmware に clone（競合しない）
    - name: Clone official QMK 0.22.14
      run: |
        git clone https://github.com/qmk/qmk_firmware.git \
          --depth 1 --recurse-submodules --shallow-submodules \
          -b 0.22.14 qmk_firmware
        ls -l qmk_firmware

    # Keyball39 を handwired 以下にコピー
    - name: Copy keyball keyboard into QMK
      run: |
        mkdir -p qmk_firmware/keyboards/handwired/keyball
        cp -r $GITHUB_WORKSPACE/${{ inputs.keyboard }} \
              qmk_firmware/keyboards/handwired/keyball/${{ inputs.keyboard }}
        echo "==== keyboards/handwired/keyball ===="
        ls -R qmk_firmware/keyboards/handwired/keyball

    - name: Install QMK python dependencies
      run: |
        cd qmk_firmware
        /opt/uv/tools/qmk/bin/python3 -m pip install -r requirements.txt

    - name: Build QMK
      run: |
        cd qmk_firmware
        make -j8 SKIP_GIT=yes \
          handwired/keyball/${{ inputs.keyboard }}:${{ inputs.keymap }}

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.keyboard }}-${{ inputs.keymap }}-firmware
        path: |
          qmk_firmware/.build/*.uf2
          qmk_firmware/.build/*.hex
