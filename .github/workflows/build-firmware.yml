jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/qmk/qmk_cli:1.2.0

    steps:
      # ... (Checkout this repository, Show QMK version のステップはそのまま)

      # 修正: qmk_firmware ではなく、official_qmk にクローンする
      - name: Clone official QMK 0.22.14
        run: |
          git clone https://github.com/qmk/qmk_firmware.git \
            --depth 1 --recurse-submodules --shallow-submodules \
            -b 0.22.14 **official_qmk**
          ls -l **official_qmk** # ディレクトリ名も変更

      # 修正: Keyball39 を official_qmk 以下にコピー
      - name: Copy keyball keyboard into QMK
        run: |
          mkdir -p **official_qmk**/keyboards/handwired/keyball
          cp -r $GITHUB_WORKSPACE/${{ inputs.keyboard }} \
                **official_qmk**/keyboards/handwired/keyball/${{ inputs.keyboard }}
          echo "==== keyboards/handwired/keyball ===="
          ls -R **official_qmk**/keyboards/handwired/keyball # ディレクトリ名も変更

      # 修正: Install QMK python dependencies
      - name: Install QMK python dependencies
        run: |
          cd **official_qmk** # ディレクトリ名も変更
          # コンテナ内の /opt/uv/tools/qmk/bin/python3 を使用しているため、パスが正しいことを確認
          /opt/uv/tools/qmk/bin/python3 -m pip install -r requirements.txt

      # 修正: Build QMK
      - name: Build QMK
        run: |
          cd **official_qmk** # ディレクトリ名も変更
          make -j8 SKIP_GIT=yes \
            handwired/keyball/${{ inputs.keyboard }}:${{ inputs.keymap }}

      # 修正: Upload firmware
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.keyboard }}-${{ inputs.keymap }}-firmware
          path: |
            **official_qmk**/.build/*.uf2
            **official_qmk**/.build/*.hex