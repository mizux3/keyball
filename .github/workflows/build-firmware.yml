name: Build firmware

on:
  workflow_call:
    inputs:
      keyboard:
        type: string
        required: true
      keymap:
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/qmk/qmk_cli:1.2.0

    steps:
    - name: Checkout keyball repo
      uses: actions/checkout@v4

    - name: Show QMK version
      run: qmk --version

    - name: Clone official QMK 0.22.14
      run: |
        git clone https://github.com/qmk/qmk_firmware.git \
          --depth 1 --recurse-submodules --shallow-submodules \
          -b 0.22.14 qmk_firmware

    - name: Copy keyball keyboard into correct folder
      run: |
        mkdir -p qmk_firmware/keyboards/handwired/keyball
        cp -r $GITHUB_WORKSPACE/${{ inputs.keyboard }} \
              qmk_firmware/keyboards/handwired/keyball/${{ inputs.keyboard }}

        echo "=== Installed Keyboard ==="
        ls -R qmk_firmware/keyboards/handwired/keyball

    - name: Install Python deps
      run: |
        cd qmk_firmware
        /opt/uv/tools/qmk/bin/python3 -m pip install -r requirements.txt

    - name: Build
      run: |
        cd qmk_firmware
        make -j8 SKIP_GIT=yes handwired/keyball/${{ inputs.keyboard }}:${{ inputs.keymap }}

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.keyboard }}-${{ inputs.keymap }}-firmware
        path: |
          qmk_firmware/.build/*.uf2
          qmk_firmware/.build/*.hex
